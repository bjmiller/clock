<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Clock</title>
</head>

<body>
  <div id="clock">
    <div id="time">
      <div id="time-display">
        <span id="time-current"></span>
        <span id="time-dayperiod"></span>
      </div>
      <div id="time-cal">
        <span id="time-day"></span>
        <span id="time-date"></span>
      </div>
    </div>
    <div id="weather">
      <div id="wx-current">
        <div id="wx-current-temp">
          <div id="wx-current-temp-readout"></div>
          <div id="wx-current-temp-feelslike"></div>
        </div>
        <div id="wx-current-condition">
          <div id="wx-current-icon"></div>
          <div id="wx-current-description"></div>
        </div>
      </div>
      <div id="wx-forecast">
        <div id="wx-forecast-0"></div>
        <div id="wx-forecast-1"></div>
        <div id="wx-forecast-2"></div>
      </div>
    </div>
    <div id="sports">
      <table id="sports-schedule"></table>
    </div>
  </div>
</body>

</html>

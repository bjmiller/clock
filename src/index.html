<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Clock</title>
</head>

<body>
  <div id="clock">
    <div id="time">
      <span id="time-current"></span>
      <span id="time-dayperiod"></span>
    </div>
    <div id="weather">
      <div id="wx-current">
        <div id="wx-current-temp">
          <div id="wx-current-temp-readout"></div>
          <div id="wx-current-temp-feelslike"></div>
        </div>
        <div id="wx-current-condition">
          <div id="wx-current-icon"></div>
          <div id="wx-current-description"></div>
        </div>
      </div>
      <div id="wx-forecast">
        <div id="wx-forecast-0">00</div>
        <div id="wx-forecast-1">01</div>
        <div id="wx-forecast-2">02</div>
      </div>
    </div>
    <div id="sports">*</div>
  </div>
</body>

</html>
